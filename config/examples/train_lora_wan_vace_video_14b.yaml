---
job: extension
config:
  name: "my_first_wan_vace_video_lora_v1"
  process:
    - type: "sd_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        # Target/output B videos. Captions live beside these target videos.
        - folder_path: "/path/to/target_B/videos"
          # Source/input A videos. Filenames must match target B video basenames.
          control_path: "/path/to/source_A/videos"
#          mask_path: "/path/to/masks"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          num_frames: 49
          fps: 16
          resolution: [480]
      train:
        batch_size: 1
        steps: 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "weighted"
        optimizer: "adamw8bit"
        lr: 1e-4
        optimizer_params:
          weight_decay: 1e-4
        cache_text_embeddings: true
        dtype: bf16
      model:
        name_or_path: "Wan-AI/Wan2.1-VACE-14B-diffusers"
        arch: "wan21_vace"
        quantize: true
        quantize_te: true
        low_vram: true
        model_kwargs:
          vace_task: "edit"
          conditioning_scale: 1.0
          default_mask: "full"
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 832
        height: 480
        num_frames: 49
        fps: 16
        samples:
          - prompt: "apply the edit"
            ctrl_img: "/path/to/source_A/videos/0001.mp4"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 5
        sample_steps: 25
meta:
  name: "[name]"
  version: "1.0"
